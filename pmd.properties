# PMD Configuration for Spring Boot ERP Application
# This file provides additional configuration for PMD analysis

# Enable analysis cache for faster subsequent runs
pmd.cache.enabled=true
pmd.cache.location=target/pmd/pmd.cache

# Report configuration
pmd.report.format=html,xml,text
pmd.report.outputDirectory=target/site/pmd

# Analysis settings
pmd.analysis.threads=4
pmd.analysis.failOnViolation=false
pmd.analysis.verbose=true

# Rule configuration
pmd.rules.priority.threshold=3
pmd.rules.include.tests=false

# Exclude patterns (additional to pom.xml excludes)
pmd.exclude.patterns=**/dto/**,**/config/**,**/ServletInitializer.java,**/ErpApplication.java