# Test Configuration for MySQL 9.x.x Database
# Using dedicated test database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/erp_test_database?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA Configuration for Tests
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.defer-datasource-initialization=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.generate-ddl=false

# SQL initialization - Use schema.sql to create tables BEFORE app starts
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=
spring.sql.init.continue-on-error=false

# MySQL Configuration
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# Logging Configuration for Tests
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.web=WARN
logging.level.krs.erp=INFO
logging.level.org.springframework.jdbc.datasource.init=DEBUG

# Disable initializers for tests
spring.main.allow-bean-definition-overriding=true
# Use lazy initialization to prevent CommandLineRunners from executing before tables are created
spring.main.lazy-initialization=true
