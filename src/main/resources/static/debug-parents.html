<!DOCTYPE html>
<html>
<head>
    <title>Debug Parents</title>
    <script src="/vendor/angularjs/angular.min.js"></script>
    <script>
        // Simple test to check if we can fetch parents data
        function testParentsAPI() {
            console.log('Testing parents API...');
            
            fetch('/api/parents')
                .then(response => {
                    console.log('Response status:', response.status);
                    return response.json();
                })
                .then(data => {
                    console.log('Parents data:', data);
                    document.getElementById('results').innerHTML = 
                        '<h3>API Response:</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('results').innerHTML = 
                        '<h3>Error:</h3><p>' + error.message + '</p>';
                });
        }
        
        // Test AngularJS module loading
        function testAngularJS() {
            try {
                console.log('Angular version:', angular.version);
                document.getElementById('angular-status').innerHTML = 
                    'AngularJS loaded: ' + angular.version.full;
            } catch (e) {
                console.error('AngularJS not loaded:', e);
                document.getElementById('angular-status').innerHTML = 
                    'AngularJS NOT loaded: ' + e.message;
            }
        }
    </script>
</head>
<body>
    <h1>Debug Parents API</h1>
    
    <div id="angular-status"></div>
    <br>
    
    <button onclick="testParentsAPI()">Test Parents API</button>
    <br><br>
    
    <div id="results"></div>
    
    <script>
        // Run tests when page loads
        testAngularJS();
    </script>
</body>
</html>
