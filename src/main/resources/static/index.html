<!DOCTYPE html>
<html lang="en" ng-app="erpApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information System</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/vendor/fontawesome/all.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="/css/app.css?v=7&t=20251026201900" rel="stylesheet">
    <link href="/css/entity-list.css?v=2&t=20251026230300" rel="stylesheet">
    <link href="/css/modules.css" rel="stylesheet">
    <link href="/css/entity-field-layout.css" rel="stylesheet">
</head>
<body> 
    <div id="app" ng-controller="MainController">
        <!-- Navigation Header -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="#!/">
                    <i class="fas fa-graduation-cap me-2"></i>
                    Student Information System
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#!/" 
                               ng-class="{active: activeTab === 'dashboard'}">
                                <i class="fas fa-tachometer-alt me-1"></i>Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#!/students" 
                               ng-class="{active: activeTab === 'students'}">
                                <i class="fas fa-user-graduate me-1"></i>Students
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#!/attendance" 
                               ng-class="{active: activeTab === 'attendance'}">
                                <i class="fas fa-calendar-check me-1"></i>Attendance
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#!/parents" 
                               ng-class="{active: activeTab === 'parents'}">
                                <i class="fas fa-users me-1"></i>Parents
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#!/health" 
                               ng-class="{active: activeTab === 'health'}">
                                <i class="fas fa-heartbeat me-1"></i>Health Records
                            </a>
                        </li>
                    </ul>
                    
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="#!/settings" 
                               ng-class="{active: activeTab === 'settings'}"
                               title="Settings">
                                <i class="fas fa-cog"></i>
                            </a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" 
                               data-bs-toggle="dropdown">
                                <i class="fas fa-user me-1"></i>{{currentUser.name || 'User'}}
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="javascript:void(0);" ng-click="logout()">
                                    <i class="fas fa-sign-out-alt me-1"></i>Logout
                                </a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Notification Display -->
        <notification-display></notification-display>

        <!-- Main Content Area -->
        <div ng-view style="padding-top: 70px;"></div>

        <!-- Loading Screen -->
        <div class="loading-overlay" ng-show="loading || moduleLoading">
            <div class="loading-content">
                <h1 class="loading-title">MK UNIVERSITY</h1>
                <div class="loading-spinner">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div class="toast" ng-repeat="toast in toasts" ng-class="'toast-' + toast.type" 
                 data-bs-autohide="true" data-bs-delay="3000">
                <div class="toast-header">
                    <i class="fas me-2" ng-class="getToastIcon(toast.type)"></i>
                    <strong class="me-auto">{{toast.title}}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
                </div>
                <div class="toast-body">{{toast.message}}</div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="/vendor/jquery/jquery.min.js"></script>
    
    <!-- Bootstrap 5 JS -->
    <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    
    <!-- AngularJS -->
    <script src="/vendor/angularjs/angular.min.js"></script>
    <script src="/vendor/angularjs/angular-route.min.js"></script>
    
    <!-- Core Application JS Files -->
    <script src="/js/app.js?v=8&t=20251026201100"></script>
    <script src="/js/core/script-loader.service.js?v=8"></script>
    <script src="/js/core/performance-monitor.service.js?v=1"></script>
    <script src="/js/core/api.js?v=3"></script>
    <script src="/js/core/main.controller.js?v=2&t=20251026200000"></script>
    <script src="/js/core/lazy-controllers.js?v=3"></script>
    
    <!-- Shared Entity List Components -->
    <script src="/js/shared/notification.service.js?v=2&t=20251026200500"></script>
    <script src="/js/shared/notification.directive.js?v=1&t=20251026200500"></script>
    <script src="/js/shared/entity-config.service.js?v=1"></script>
    <script src="/js/shared/entity-data.service.js?v=3&t=20251026195800"></script>
    <script src="/js/shared/entity-list.controller.js?v=12&t=20251026230700"></script>
    
    <!-- Student Module - Load Immediately -->
    <script src="/js/modules/students.module.js?v=2"></script>
    <script src="/js/student/student.service.js?v=4"></script>
    <script src="/js/student/student.controller.simple.js?v=2"></script>
    <script src="/js/student/student.controller.js?v=5"></script>
    <script src="/js/student/student-entity.controller.js?v=17&t=20251026230600"></script>
    <script src="/js/student/student-edit.controller.js?v=8&t=20251026200400"></script>
    <script src="/js/student/student-edit.controller.js?v=8&t=20251026200400"></script></script>
    
    <!-- Parent Module - Load Immediately -->
    <script src="/js/modules/parents.module.js?v=2"></script>
    <script src="/js/parent/parent.service.js?v=3"></script>
    <script src="/js/parent/parent.controller.js?v=3"></script>
    
    <!-- Organization Module - Load Immediately -->
    <script src="/js/modules/organization.module.js?v=1"></script>
    <script src="/js/organization/organization-details.controller.js?v=1"></script>
    
    <!-- Modules Module -->
    <script src="/js/modules/modules.controller.js?v=1"></script>
    <script src="/js/settings/entity-field-layout.controller.js?v=1"></script>
    
    <!-- Recycle Bin Module -->
    <script src="/js/recycle-bin.controller.js?v=1"></script>
    
    <!-- Entity-specific JS files are now loaded lazily when needed -->
</body>
</html>
