<!DOCTYPE html>
<html>
<head>
    <title>Lazy Loading Performance Test</title>
    <script>
        // Test the lazy loading system
        function testLazyLoading() {
            console.log('🚀 Testing lazy loading performance...');
            
            // Record initial script count
            var initialScripts = document.querySelectorAll('script').length;
            console.log('📊 Initial script count:', initialScripts);
            
            // Test navigation to different routes
            var routes = ['#!/students', '#!/parents', '#!/attendance', '#!/health', '#!/settings'];
            var currentRouteIndex = 0;
            
            function testNextRoute() {
                if (currentRouteIndex >= routes.length) {
                    console.log('✅ Lazy loading test completed!');
                    return;
                }
                
                var route = routes[currentRouteIndex];
                console.log('🔄 Testing route:', route);
                
                // Navigate to route
                window.location.hash = route;
                
                // Check script count after a delay
                setTimeout(function() {
                    var newScriptCount = document.querySelectorAll('script').length;
                    console.log('📈 Scripts after loading ' + route + ':', newScriptCount);
                    
                    currentRouteIndex++;
                    setTimeout(testNextRoute, 1000); // Wait before next route
                }, 2000);
            }
            
            // Start testing
            testNextRoute();
        }
        
        // Auto-start test when page loads
        window.addEventListener('load', function() {
            setTimeout(testLazyLoading, 2000);
        });
    </script>
</head>
<body>
    <h1>Lazy Loading Performance Test</h1>
    <p>This page tests the lazy loading functionality.</p>
    <p>Check the browser console for test results.</p>
    
    <div>
        <h2>Test Links:</h2>
        <a href="#!/students">Students</a> |
        <a href="#!/parents">Parents</a> |
        <a href="#!/attendance">Attendance</a> |
        <a href="#!/health">Health</a> |
        <a href="#!/settings">Settings</a>
    </div>
    
    <div style="margin-top: 20px;">
        <button onclick="testLazyLoading()">Run Performance Test</button>
        <button onclick="console.clear()">Clear Console</button>
    </div>
</body>
</html>
