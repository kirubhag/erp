<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Information System</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/vendor/fontawesome/all.min.css" rel="stylesheet">
    
    <!-- Login Page CSS -->
    <link href="/css/login.css" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-graduation-cap"></i>
                <h2>Welcome Back</h2>
                <p>Student Information System</p>
            </div>
            
            <!-- Error Message -->
            <div class="alert alert-danger" role="alert" id="errorAlert" style="display: none;">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span id="errorMessage">Invalid username or password</span>
            </div>
            
            <!-- Logout Success Message -->
            <div class="alert alert-success" role="alert" id="logoutAlert" style="display: none;">
                <i class="fas fa-check-circle me-2"></i>
                You have been successfully logged out
            </div>
            
            <!-- Login Form -->
            <form action="/login" method="POST" id="loginForm">
                <input type="hidden" id="csrf-token" name="_csrf" value="">
                
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" class="form-control" id="username" name="username" 
                               placeholder="Username" required autofocus>
                    </div>
                </div>
                
                <div class="mb-4">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="Password" required>
                    </div>
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember-me">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-login w-100">
                    <i class="fas fa-sign-in-alt me-2"></i>Login
                </button>
            </form>
            
            <!-- Demo Credentials -->
            <div class="demo-credentials">
                <h6><i class="fas fa-info-circle me-1"></i>Demo Credentials</h6>
                <p><strong>Admin:</strong> admin / admin123</p>
                <p><strong>Student:</strong> student / student123</p>
                <p><strong>Teacher:</strong> teacher / teacher123</p>
            </div>
        </div>
    </div>
    
    <!-- Login Page JavaScript -->
    <script src="/js/login.js"></script>
</body>
</html>
