<div class="container-fluid mt-3">
  <!-- Breadcrumb Navigation -->
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="#!/">Home</a></li>
      <li class="breadcrumb-item"><a href="#!/settings">Settings</a></li>
      <li class="breadcrumb-item"><a href="#!/settings/organisation">Organisation</a></li>
      <li class="breadcrumb-item active" aria-current="page">Edit</li>
    </ol>
  </nav>

  <div class="card">
    <div class="card-header bg-warning text-dark">
      <i class="fas fa-edit me-2"></i>Edit Organisation
      <div class="float-end">
        <a href="#!/settings/organisation" class="btn btn-sm btn-light">
          <i class="fas fa-eye me-1"></i>View
        </a>
      </div>
    </div>
    <div class="card-body">
      <form name="organizationForm" ng-submit="saveOrganization()" novalidate>
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="orgName" class="form-label">Organization Name</label>
            <input type="text" class="form-control" id="orgName" ng-model="organizationData.name" required autofocus>
          </div>
          <div class="col-md-6">
            <label for="orgType" class="form-label">Type</label>
            <select class="form-select" id="orgType" ng-model="organizationData.type" ng-options="type.value as type.label for type in organizationTypes" required></select>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="orgEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="orgEmail" ng-model="organizationData.contactInfo.email" required>
          </div>
          <div class="col-md-6">
            <label for="orgPhone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="orgPhone" ng-model="organizationData.contactInfo.phoneNumber">
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-12">
            <label for="orgAddress" class="form-label">Address</label>
            <input type="text" class="form-control mb-2" id="orgAddress1" ng-model="organizationData.address.line1" placeholder="Address Line 1">
            <input type="text" class="form-control mb-2" id="orgAddress2" ng-model="organizationData.address.line2" placeholder="Address Line 2">
            <input type="text" class="form-control mb-2" id="orgCity" ng-model="organizationData.address.city" placeholder="City">
            <input type="text" class="form-control mb-2" id="orgState" ng-model="organizationData.address.state" placeholder="State">
            <input type="text" class="form-control mb-2" id="orgPostalCode" ng-model="organizationData.address.postalCode" placeholder="Postal Code">
            <input type="text" class="form-control mb-2" id="orgCountry" ng-model="organizationData.address.country" placeholder="Country">
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="orgWebsite" class="form-label">Website</label>
            <input type="url" class="form-control" id="orgWebsite" ng-model="organizationData.contactInfo.website">
          </div>
          <div class="col-md-6">
            <label for="orgYear" class="form-label">Established Year</label>
            <input type="number" class="form-control" id="orgYear" ng-model="organizationData.establishedYear" min="1800" max="{{currentYear}}">
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-12">
            <label for="orgMotto" class="form-label">Motto</label>
            <input type="text" class="form-control" id="orgMotto" ng-model="organizationData.branding.motto">
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-12">
            <label for="orgDescription" class="form-label">Description</label>
            <textarea class="form-control" id="orgDescription" ng-model="organizationData.branding.description" rows="2"></textarea>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="orgLogo" class="form-label">Logo URL</label>
            <input type="url" class="form-control" id="orgLogo" ng-model="organizationData.branding.logoUrl">
          </div>
          <div class="col-md-6">
            <label for="orgColor" class="form-label">Primary Color</label>
            <input type="color" class="form-control form-control-color" id="orgColor" ng-model="organizationData.branding.primaryColor">
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-12 text-end">
            <button type="submit" class="btn btn-success me-2">
              <i class="fas fa-save me-1"></i>Save Organization
            </button>
            <button type="button" class="btn btn-secondary me-2" ng-click="resetToDefaults()">
              <i class="fas fa-undo me-1"></i>Reset
            </button>
            <a href="#!/settings/organisation" class="btn btn-outline-secondary">
              <i class="fas fa-times me-1"></i>Cancel
            </a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
