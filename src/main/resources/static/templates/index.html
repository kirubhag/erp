<!DOCTYPE html>
<html lang="en" ng-app="erpApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information System</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/vendor/fontawesome/all.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
    <div id="app" ng-controller="MainController">
        <!-- Navigation Header -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <i class="fas fa-graduation-cap me-2"></i>
                    Student Information System
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#" ng-click="setActiveTab('dashboard')" 
                               ng-class="{active: activeTab === 'dashboard'}">
                                <i class="fas fa-tachometer-alt me-1"></i>Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" ng-click="setActiveTab('students')" 
                               ng-class="{active: activeTab === 'students'}">
                                <i class="fas fa-user-graduate me-1"></i>Students
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" ng-click="setActiveTab('attendance')" 
                               ng-class="{active: activeTab === 'attendance'}">
                                <i class="fas fa-calendar-check me-1"></i>Attendance
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" ng-click="setActiveTab('parents')" 
                               ng-class="{active: activeTab === 'parents'}">
                                <i class="fas fa-users me-1"></i>Parents
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" ng-click="setActiveTab('health')" 
                               ng-class="{active: activeTab === 'health'}">
                                <i class="fas fa-heartbeat me-1"></i>Health Records
                            </a>
                        </li>
                    </ul>
                    
                    <ul class="navbar-nav">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" 
                               data-bs-toggle="dropdown">
                                <i class="fas fa-user me-1"></i>{{currentUser.name || 'User'}}
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#" ng-click="logout()">
                                    <i class="fas fa-sign-out-alt me-1"></i>Logout
                                </a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <div class="container-fluid mt-3">
            <!-- Dashboard Tab -->
            <div ng-show="activeTab === 'dashboard'" ng-include="'/templates/dashboard.html'"></div>
            
            <!-- Students Tab -->
            <div ng-show="activeTab === 'students'" ng-include="'/templates/students.html'"></div>
            
            <!-- Attendance Tab -->
            <div ng-show="activeTab === 'attendance'" ng-include="'/templates/attendance.html'"></div>
            
            <!-- Parents Tab -->
            <div ng-show="activeTab === 'parents'" ng-include="'/templates/parents.html'"></div>
            
            <!-- Health Records Tab -->
            <div ng-show="activeTab === 'health'" ng-include="'/templates/health.html'"></div>
        </div>

        <!-- Loading Spinner -->
        <div class="loading-overlay" ng-show="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div class="toast" ng-repeat="toast in toasts" ng-class="'toast-' + toast.type" 
                 data-bs-autohide="true" data-bs-delay="3000">
                <div class="toast-header">
                    <i class="fas me-2" ng-class="getToastIcon(toast.type)"></i>
                    <strong class="me-auto">{{toast.title}}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
                </div>
                <div class="toast-body">{{toast.message}}</div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    
    <!-- AngularJS -->
    <script src="/vendor/angularjs/angular.min.js"></script>
    <script src="/vendor/angularjs/angular-route.min.js"></script>
    
    <!-- Application JS Files -->
    <script src="/js/app.js"></script>
    <script src="/js/services/api.js"></script>
    <script src="/js/services/student.service.js"></script>
    <script src="/js/services/attendance.service.js"></script>
    <script src="/js/services/parent.service.js"></script>
    <script src="/js/services/health.service.js"></script>
    <script src="/js/controllers/main.controller.js"></script>
    <script src="/js/controllers/student.controller.js"></script>
    <script src="/js/controllers/attendance.controller.js"></script>
    <script src="/js/controllers/parent.controller.js"></script>
    <script src="/js/controllers/health.controller.js"></script>
</body>
</html>
