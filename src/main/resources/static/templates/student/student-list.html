<!-- Modern Student List Template -->
<div ng-controller="StudentEntityController">
    <div ng-include="'/templates/shared/entity-list.html'"></div>

    <!-- Student Form Modal -->
    <div ng-include="'/templates/student/student-form-modal.html'"></div>

    <!-- Delete Confirmation Modal -->
<div class="delete-modal-wrapper" 
     ng-show="showDeleteModal" 
     ng-click="cancelDelete()">
    <div class="delete-modal-dialog" 
         ng-click="$event.stopPropagation()">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title">
                    <i class="fas fa-exclamation-triangle text-danger me-2"></i>
                    Confirm Delete
                </h5>
                <button type="button" class="btn-close" ng-click="cancelDelete()"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0">
                    Are you sure you want to delete 
                    <strong>{{studentToDelete.firstName}} {{studentToDelete.lastName}}</strong>?
                </p>
                <p class="text-muted small mb-0 mt-2">
                    <i class="fas fa-info-circle me-1"></i>
                    This action cannot be undone.
                </p>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" ng-click="cancelDelete()">
                    <i class="fas fa-times me-1"></i>Cancel
                </button>
                <button type="button" class="btn btn-danger" ng-click="confirmDelete()">
                    <i class="fas fa-trash me-1"></i>Delete Student
                </button>
            </div>
        </div>
    </div>
</div>
<div class="delete-modal-backdrop" ng-show="showDeleteModal"></div>

<!-- Student-specific CSS overrides -->
<style>
    /* Student-specific styling */
    .student-avatar {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .student-status.active {
        background-color: #d1fae5;
        color: #065f46;
    }
    
    .student-status.inactive {
        background-color: #fee2e2;
        color: #991b1b;
    }
    
    .student-grade {
        font-weight: 600;
        color: #3730a3;
    }

    .entity-list-container .student-row:hover {
        background-color: #f0f4ff;
    }

    .student-id-badge {
        background: #e0e7ff;
        color: #3730a3;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 500;
    }
</style>
</div>
