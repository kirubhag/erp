<!-- Student Form Modal -->
<div class="modal fade show" ng-show="showStudentModal" style="display: block; background-color: rgba(0,0,0,0.5);" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-user-graduate me-2"></i>
                    {{editingStudent ? 'Edit Student' : 'Add New Student'}}
                </h5>
                <button type="button" class="btn-close" ng-click="closeStudentModal()"></button>
            </div>
            <form ng-submit="saveStudent()" novalidate>
                <div class="modal-body">
                    <div class="row">
                        <!-- Basic Information Section -->
                        <div class="col-12">
                            <h6 class="section-title"><i class="fas fa-user me-2"></i>Basic Information</h6>
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Student ID <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" ng-model="studentForm.studentId" 
                                   placeholder="Enter student ID" required>
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label class="form-label">First Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" ng-model="studentForm.firstName" 
                                   placeholder="Enter first name" required>
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Last Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" ng-model="studentForm.lastName" 
                                   placeholder="Enter last name" required>
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Middle Name</label>
                            <input type="text" class="form-control" ng-model="studentForm.middleName" 
                                   placeholder="Enter middle name">
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Date of Birth <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" ng-model="studentForm.dateOfBirth" required>
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Gender <span class="text-danger">*</span></label>
                            <select class="form-select" ng-model="studentForm.gender" required>
                                <option value="">Select Gender</option>
                                <option value="MALE">Male</option>
                                <option value="FEMALE">Female</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>
                        
                        <!-- Academic Information Section -->
                        <div class="col-12 mt-4">
                            <h6 class="section-title"><i class="fas fa-graduation-cap me-2"></i>Academic Information</h6>
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Grade Level <span class="text-danger">*</span></label>
                            <select class="form-select" ng-model="studentForm.gradeLevel" required>
                                <option value="">Select Grade</option>
                                <option ng-repeat="grade in gradeLevels" value="{{grade}}">{{formatGradeName(grade)}}</option>
                            </select>
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Enrollment Status</label>
                            <select class="form-select" ng-model="studentForm.enrollmentStatus">
                                <option value="ENROLLED">Enrolled</option>
                                <option value="PENDING">Pending</option>
                                <option value="WITHDRAWN">Withdrawn</option>
                                <option value="GRADUATED">Graduated</option>
                            </select>
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Enrollment Date</label>
                            <input type="date" class="form-control" ng-model="studentForm.enrollmentDate">
                        </div>
                        
                        <!-- Contact Information Section -->
                        <div class="col-12 mt-4">
                            <h6 class="section-title"><i class="fas fa-phone me-2"></i>Contact Information</h6>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" ng-model="studentForm.email" 
                                   placeholder="Enter email address">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" ng-model="studentForm.phoneNumber" 
                                   placeholder="Enter phone number">
                        </div>
                        
                        <!-- Address Section -->
                        <div class="col-12 mt-4">
                            <h6 class="section-title"><i class="fas fa-map-marker-alt me-2"></i>Address Information</h6>
                        </div>
                        
                        <div class="col-12 mb-3">
                            <label class="form-label">Street Address</label>
                            <input type="text" class="form-control" ng-model="studentForm.address.street" 
                                   placeholder="Enter street address">
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label class="form-label">City</label>
                            <input type="text" class="form-control" ng-model="studentForm.address.city" 
                                   placeholder="Enter city">
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label class="form-label">State</label>
                            <input type="text" class="form-control" ng-model="studentForm.address.state" 
                                   placeholder="Enter state">
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Zip Code</label>
                            <input type="text" class="form-control" ng-model="studentForm.address.zipCode" 
                                   placeholder="Enter zip code">
                        </div>
                        
                        <!-- Emergency Contact Section -->
                        <div class="col-12 mt-4">
                            <h6 class="section-title"><i class="fas fa-exclamation-triangle me-2"></i>Emergency Contact</h6>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Emergency Contact Name</label>
                            <input type="text" class="form-control" ng-model="studentForm.emergencyContact.name" 
                                   placeholder="Enter emergency contact name">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Emergency Contact Phone</label>
                            <input type="tel" class="form-control" ng-model="studentForm.emergencyContact.phoneNumber" 
                                   placeholder="Enter emergency contact phone">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Relationship</label>
                            <input type="text" class="form-control" ng-model="studentForm.emergencyContact.relationship" 
                                   placeholder="e.g., Parent, Guardian, Sibling">
                        </div>
                        
                        <!-- Additional Information -->
                        <div class="col-12 mt-4">
                            <h6 class="section-title"><i class="fas fa-info-circle me-2"></i>Additional Information</h6>
                        </div>
                        
                        <div class="col-12 mb-3">
                            <label class="form-label">Notes</label>
                            <textarea class="form-control" rows="3" ng-model="studentForm.notes" 
                                      placeholder="Additional notes about the student"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" ng-click="closeStudentModal()">
                        <i class="fas fa-times me-1"></i>Cancel
                    </button>
                    <button type="submit" class="btn btn-primary" ng-disabled="studentFormSubmitting">
                        <i class="fas fa-save me-1" ng-show="!studentFormSubmitting"></i>
                        <i class="fas fa-spinner fa-spin me-1" ng-show="studentFormSubmitting"></i>
                        {{editingStudent ? 'Update Student' : 'Save Student'}}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Styles -->
<style>
.section-title {
    color: #374151;
    font-weight: 600;
    border-bottom: 2px solid #e5e7eb;
    padding-bottom: 8px;
    margin-bottom: 16px;
}

.modal-xl {
    max-width: 90%;
}

.form-label {
    font-weight: 500;
    color: #374151;
    margin-bottom: 4px;
}

.text-danger {
    color: #dc2626 !important;
}

.modal-content {
    border: none;
    border-radius: 12px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
}

.modal-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 12px 12px 0 0;
    border-bottom: none;
}

.modal-header .btn-close {
    filter: brightness(0) invert(1);
}

.modal-body {
    padding: 24px;
    max-height: 70vh;
    overflow-y: auto;
}

.modal-footer {
    border-top: 1px solid #e5e7eb;
    padding: 16px 24px;
}
</style>
