<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" [routerLink]="['/dashboard']">
      <i class="fas fa-graduation-cap me-2"></i>
      {{organizationName}}
    </a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <!-- Dynamic menu items (visible) -->
        <li class="nav-item" *ngFor="let menuItem of visibleMenuItems">
          <a class="nav-link" 
             [routerLink]="[menuItem.route]" 
             routerLinkActive="active"
             [routerLinkActiveOptions]="{exact: true}">
            <i [class]="menuItem.icon + ' me-1'"></i>{{menuItem.pluralName}}
          </a>
        </li>
        
        <!-- More dropdown for overflow items -->
        <li class="nav-item dropdown" *ngIf="hasOverflow">
          <a class="nav-link dropdown-toggle" href="#" role="button" 
             data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fas fa-ellipsis-h"></i>
          </a>
          <ul class="dropdown-menu">
            <li *ngFor="let menuItem of overflowMenuItems">
              <a class="dropdown-item" [routerLink]="[menuItem.route]"
                 routerLinkActive="active">
                <i [class]="menuItem.icon + ' me-2'"></i>{{menuItem.pluralName}}
              </a>
            </li>
          </ul>
        </li>
      </ul>
      
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="#" title="Settings">
            <i class="fas fa-cog"></i>
          </a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" 
             data-bs-toggle="dropdown">
            <i class="fas fa-user me-1"></i>{{currentUser.name}}
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#" (click)="logout(); $event.preventDefault()">
              <i class="fas fa-sign-out-alt me-1"></i>Logout
            </a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
