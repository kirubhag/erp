<div class="container-fluid min-vh-100 bg-light p-4">
    <div class="container" style="max-width: 900px;">
        <h1 class="h2 fw-bold text-dark mb-4">Library Catalog</h1>

        <!-- Search Bar -->
        <div class="position-relative mb-5">
            <div
                class="input-group input-group-lg shadow-sm rounded-pill overflow-hidden bg-white border border-secondary-subtle">
                <span class="input-group-text bg-white border-0 ps-4 text-muted">
                    <i class="fas fa-search"></i>
                </span>
                <input type="text" [(ngModel)]="searchQuery" (ngModelChange)="onSearch($event)"
                    class="form-control border-0 py-3 shadow-none text-dark"
                    placeholder="Search by title, author, or ISBN..." aria-label="Search">

                <span *ngIf="loading" class="input-group-text bg-white border-0 pe-4">
                    <i class="fas fa-circle-notch fa-spin text-primary"></i>
                </span>
            </div>
            <div class="form-text mt-2 ms-3 text-muted" *ngIf="searchQuery.length <= 2">
                Type at least 3 characters to search...
            </div>
        </div>

        <!-- Results List -->
        <div class="vstack gap-3">
            <div *ngFor="let book of results" class="card border-0 shadow-sm rounded-4 hover-lift transition-base">
                <div class="card-body p-4">
                    <div class="d-flex gap-4">
                        <!-- Book Cover Placeholder -->
                        <div class="flex-shrink-0">
                            <div
                                class="book-cover rounded-3 bg-secondary-subtle d-flex align-items-center justify-content-center text-muted position-relative overflow-hidden">
                                <img *ngIf="book.thumbnail" [src]="book.thumbnail" class="w-100 h-100 object-fit-cover"
                                    alt="Cover">
                                <i *ngIf="!book.thumbnail" class="fas fa-book display-6"></i>
                            </div>
                        </div>

                        <!-- Book Details -->
                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between align-items-start mb-1">
                                <h4 class="h5 fw-bold text-dark mb-1">{{ book.title }}</h4>
                                <span
                                    class="badge bg-success-subtle text-success rounded-pill px-3 py-2 text-uppercase fw-bold small">Available</span>
                            </div>

                            <p class="text-primary fw-medium mb-2">{{ book.author?.name || 'Unknown Author' }}</p>
                            <p class="text-secondary small mb-3 text-truncate-2">{{ book.description }}</p>

                            <div class="d-flex gap-3 text-muted small">
                                <span *ngIf="book.isbnIssn" class="d-flex align-items-center gap-2">
                                    <i class="fas fa-barcode"></i> {{ book.isbnIssn }}
                                </span>
                                <span class="d-flex align-items-center gap-2">
                                    <i class="fas fa-calendar"></i> {{ book.year }}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty States -->
            <div *ngIf="results.length === 0 && searchQuery.length > 2 && !loading" class="text-center py-5">
                <div class="mb-3">
                    <i class="fas fa-search fa-3x text-muted opacity-25"></i>
                </div>
                <h5 class="text-muted fw-normal">No books found matching "{{ searchQuery }}"</h5>
            </div>
        </div>
    </div>
</div>
