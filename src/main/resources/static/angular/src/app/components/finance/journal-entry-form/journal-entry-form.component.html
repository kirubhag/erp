<div class="container mt-4 pb-5">
    <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
            <h3 class="mb-0">{{ id ? 'Edit' : 'New' }} Journal Entry</h3>
        </div>
        <div class="card-body">
            <form [formGroup]="entryForm" (ngSubmit)="onSubmit()">
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Entry Number</label>
                        <input type="text" class="form-control" formControlName="entryNumber" placeholder="e.g. JE-001">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Date</label>
                        <input type="date" class="form-control" formControlName="date">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Reference</label>
                        <input type="text" class="form-control" formControlName="reference">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" formControlName="description" rows="2"></textarea>
                </div>

                <h5 class="mb-3 border-bottom pb-2">Line Items</h5>
                <div class="table-responsive">
                    <table class="table table-bordered align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 30%">Account</th>
                                <th>Label</th>
                                <th style="width: 15%">Debit</th>
                                <th style="width: 15%">Credit</th>
                                <th style="width: 50px"></th>
                            </tr>
                        </thead>
                        <tbody formArrayName="items">
                            <tr *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                                <td>
                                    <select class="form-select" formControlName="accountId">
                                        <option [ngValue]="null">Select Account</option>
                                        <option *ngFor="let acc of accounts" [ngValue]="acc.id">{{ acc.code }} - {{
                                            acc.name }}</option>
                                    </select>
                                </td>
                                <td>
                                    <input type="text" class="form-control" formControlName="label">
                                </td>
                                <td>
                                    <input type="number" class="form-control text-end" formControlName="debit"
                                        step="0.01">
                                </td>
                                <td>
                                    <input type="number" class="form-control text-end" formControlName="credit"
                                        step="0.01">
                                </td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-outline-danger btn-sm" (click)="removeItem(i)">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot class="table-light fw-bold">
                            <tr>
                                <td colspan="2" class="text-end">Totals</td>
                                <td class="text-end">{{ getTotalDebit() | number:'1.2-2' }}</td>
                                <td class="text-end">{{ getTotalCredit() | number:'1.2-2' }}</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>

                <button type="button" class="btn btn-outline-secondary mb-4" (click)="addItem()">
                    <i class="fas fa-plus me-1"></i> Add Line
                </button>

                <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                    <button type="button" class="btn btn-light"
                        (click)="router.navigate(['/setup/finance/journal-entries'])">Cancel</button>
                    <button type="submit" class="btn btn-primary" [disabled]="saving || !entryForm.valid">
                        <span *ngIf="saving" class="spinner-border spinner-border-sm me-1"></span>
                        Save Journal Entry
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
