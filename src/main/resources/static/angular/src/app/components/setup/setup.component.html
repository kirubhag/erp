<div class="setup-wrapper">
  <!-- Main Content -->
  <div class="setup-container">
    <!-- Header -->
    <div class="setup-header">
      <h1 class="setup-title">Setup</h1>
      <div class="search-box">
        <input 
          type="text" 
          class="search-input" 
          placeholder="Search"
          [(ngModel)]="searchTerm"
          (input)="onSearch($event)"
          id="searchInput">
      </div>
    </div>

    <!-- Setup Sections Grid -->
    <div class="row">
      <div class="col-lg-4 col-md-6 mb-4" *ngFor="let section of filteredSections; trackBy: trackSection">
        <div class="setup-section">
          <h3 class="section-title">{{ section.title }}</h3>
          <div 
            class="setup-item" 
            *ngFor="let item of section.items; trackBy: trackItem"
            (click)="onItemClick(item)"
            [attr.data-section]="section.title">
            {{ item.label }}
          </div>
        </div>
      </div>
    </div>

    <!-- No Results -->
    <div class="no-results" *ngIf="filteredSections.length === 0 && searchTerm">
      <div class="text-center py-5">
        <i class="fas fa-search fa-3x text-muted mb-3"></i>
        <h5 class="text-muted">No settings found</h5>
        <p class="text-muted">Try adjusting your search term or browse all categories</p>
        <button class="btn btn-primary" (click)="clearSearch()">Clear Search</button>
      </div>
    </div>
  </div>
</div>
