<div class="register-wrapper">
  <div class="register-container">
    <div class="register-card">
      <div class="register-header">
        <div class="register-logo">
          <i class="fas fa-graduation-cap"></i>
        </div>
        <h1>Create Account</h1>
        <p>Join Edu ERP Today</p>
      </div>

      <form class="register-form" (submit)="onRegister()">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input
              type="text"
              id="firstName"
              class="form-control"
              placeholder="First name"
              [(ngModel)]="firstName"
              name="firstName"
              required
            >
          </div>

          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input
              type="text"
              id="lastName"
              class="form-control"
              placeholder="Last name"
              [(ngModel)]="lastName"
              name="lastName"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="Enter your email"
            [(ngModel)]="email"
            name="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Enter your password (min 6 characters)"
            [(ngModel)]="password"
            name="password"
            (input)="checkPasswordMatch()"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            [ngClass]="{'is-invalid': !passwordsMatch && confirmPassword.length > 0}"
            placeholder="Confirm your password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            (input)="checkPasswordMatch()"
            required
          >
          <div *ngIf="!passwordsMatch && confirmPassword.length > 0" class="invalid-feedback">
            <i class="fas fa-exclamation-circle"></i> Passwords do not match
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger">
          <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="alert alert-success">
          <i class="fas fa-check-circle"></i> {{ successMessage }}
        </div>

        <button type="submit" class="btn btn-primary btn-block" [disabled]="loading || !passwordsMatch">
          <i class="fas fa-spinner fa-spin" *ngIf="loading"></i>
          {{ loading ? 'Creating Account...' : 'Sign Up' }}
        </button>
      </form>

      <div class="register-footer">
        <p>Already have an account? <a routerLink="/login">Sign in here</a></p>
      </div>

      <div class="terms">
        <p>By signing up, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></p>
      </div>
    </div>

    <div class="register-image">
      <div class="image-content">
        <i class="fas fa-rocket fa-5x"></i>
        <h2>Get Started</h2>
        <p>Start your free trial today. No credit card required.</p>
      </div>
    </div>
  </div>
</div>
