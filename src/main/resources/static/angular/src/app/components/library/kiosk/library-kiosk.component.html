<div class="d-flex flex-column align-items-center justify-content-center min-vh-100 bg-dark position-relative p-4">

    <!-- Back Button -->
    <button *ngIf="mode !== 'SELECT'" (click)="goHome()"
        class="btn btn-outline-light position-absolute top-0 start-0 m-4 shadow-sm">
        <i class="fas fa-arrow-left me-2"></i> Home
    </button>

    <!-- SELECT MODE -->
    <div *ngIf="mode === 'SELECT'" class="row g-4 w-100" style="max-width: 900px;">
        <div class="col-md-6">
            <button (click)="selectMode('ISSUE')"
                class="card h-100 w-100 border-0 shadow-lg text-start p-5 bg-gradient-primary hover-scale transition-base cursor-pointer">
                <div class="card-body position-relative z-1">
                    <div class="position-absolute top-0 end-0 p-4 opacity-10">
                        <i class="fas fa-book-open display-1 text-white"></i>
                    </div>
                    <h2 class="display-5 fw-bold text-white mb-3">Issue a Book</h2>
                    <p class="text-white-50 fs-5 mb-0">Scan your ID card to begin borrowing</p>
                </div>
            </button>
        </div>

        <div class="col-md-6">
            <button (click)="selectMode('RETURN')"
                class="card h-100 w-100 border-0 shadow-lg text-start p-5 bg-gradient-teal hover-scale transition-base cursor-pointer">
                <div class="card-body position-relative z-1">
                    <div class="position-absolute top-0 end-0 p-4 opacity-10">
                        <i class="fas fa-undo display-1 text-white"></i>
                    </div>
                    <h2 class="display-5 fw-bold text-white mb-3">Return a Book</h2>
                    <p class="text-white-50 fs-5 mb-0">Scan the book barcode to return it</p>
                </div>
            </button>
        </div>
    </div>

    <!-- INTERACTIVE SCREEN -->
    <div *ngIf="mode !== 'SELECT'" class="card w-100 border-0 shadow-lg rounded-4 overflow-hidden"
        style="max-width: 700px; min-height: 500px;">

        <!-- User Header (If Identified) -->
        <div *ngIf="currentUser" class="card-header bg-indigo-subtle border-0 p-4">
            <div class="d-flex align-items-center gap-3">
                <div
                    class="avatar-lg bg-indigo-200 text-indigo rounded-circle d-flex align-items-center justify-content-center fw-bold fs-4">
                    {{ currentUser.name.charAt(0) }}
                </div>
                <div>
                    <h4 class="fw-bold text-dark mb-0">Welcome, {{ currentUser.name }}</h4>
                    <p class="text-indigo mb-0">{{ currentUser.booksOut }} books currently borrowed</p>
                </div>
            </div>
        </div>

        <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-5">

            <!-- Step 1: User Scan -->
            <div *ngIf="step === 'USER_SCAN'" class="w-100">
                <div class="mb-5 position-relative d-inline-block">
                    <div class="pulse-ring bg-primary opacity-25"></div>
                    <i class="fas fa-id-card display-1 text-primary position-relative z-1"></i>
                </div>
                <h2 class="fw-bold text-dark mb-2">Scan Your ID Card</h2>
                <p class="text-muted mb-5">Place your ID card under the scanner</p>
                <div class="mx-auto" style="max-width: 400px;">
                    <input id="barcodeInput" type="text" [(ngModel)]="userBarcode" (keyup.enter)="onUserScan()"
                        class="form-control form-control-lg text-center fs-3 py-3 border-2 border-primary-subtle rounded-3 shadow-sm focus-ring"
                        placeholder="Scanning..." autofocus>
                </div>
            </div>

            <!-- Step 2: Book Scan -->
            <div *ngIf="step === 'BOOK_SCAN'" class="w-100">
                <div class="mb-5 position-relative d-inline-block">
                    <div class="pulse-ring bg-primary opacity-25"></div>
                    <i class="fas fa-barcode display-1 text-primary position-relative z-1"></i>
                </div>
                <h2 class="fw-bold text-dark mb-2">Scan Book Barcode</h2>
                <p class="text-muted mb-5">Scan the barcode on the back of the book</p>
                <div class="mx-auto" style="max-width: 400px;">
                    <input id="barcodeInput" type="text" [(ngModel)]="bookBarcode" (keyup.enter)="onBookScan()"
                        class="form-control form-control-lg text-center fs-3 py-3 border-2 border-primary-subtle rounded-3 shadow-sm focus-ring"
                        placeholder="Scanning..." autofocus>
                </div>
            </div>

            <!-- Step 3: Success -->
            <div *ngIf="step === 'SUCCESS'" class="w-100">
                <div class="mb-4">
                    <div
                        class="success-icon-bg bg-success-subtle rounded-circle d-flex align-items-center justify-content-center mx-auto animate-bounce">
                        <i class="fas fa-check display-3 text-success"></i>
                    </div>
                </div>
                <h2 class="fw-bold text-dark mb-2">Success!</h2>
                <p class="text-muted fs-5 mb-5">{{ successMessage }}</p>

                <button (click)="resetState()"
                    class="btn btn-primary btn-lg px-5 py-3 rounded-pill fw-medium shadow-sm hover-lift">
                    Scan Another
                </button>
            </div>

        </div>
    </div>

</div>
