<div class="min-h-screen bg-gray-900 flex flex-col items-center justify-center p-4 relative overflow-hidden">

    <!-- Back Button -->
    <button *ngIf="mode !== 'SELECT'" (click)="goHome()"
        class="absolute top-8 left-8 text-white/50 hover:text-white flex items-center gap-2 text-lg">
        <i class="fas fa-arrow-left"></i> Home
    </button>

    <!-- SELECT MODE -->
    <div *ngIf="mode === 'SELECT'" class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl">
        <button (click)="selectMode('ISSUE')"
            class="group relative bg-gradient-to-br from-indigo-600 to-indigo-800 p-12 rounded-3xl shadow-2xl hover:scale-105 transition-all duration-300">
            <div class="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity">
                <i class="fas fa-book-open text-9xl text-white"></i>
            </div>
            <h2 class="text-4xl font-bold text-white mb-4">Issue a Book</h2>
            <p class="text-indigo-200 text-lg">Scan your ID card to begin borrowing</p>
        </button>

        <button (click)="selectMode('RETURN')"
            class="group relative bg-gradient-to-br from-teal-600 to-teal-800 p-12 rounded-3xl shadow-2xl hover:scale-105 transition-all duration-300">
            <div class="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity">
                <i class="fas fa-undo text-9xl text-white"></i>
            </div>
            <h2 class="text-4xl font-bold text-white mb-4">Return a Book</h2>
            <p class="text-teal-200 text-lg">Scan the book barcode to return it</p>
        </button>
    </div>

    <!-- INTERACTIVE SCREEN -->
    <div *ngIf="mode !== 'SELECT'"
        class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl overflow-hidden min-h-[500px] flex flex-col">

        <!-- User Header (If Identified) -->
        <div *ngIf="currentUser" class="bg-indigo-50 p-6 flex items-center gap-4">
            <div
                class="w-16 h-16 bg-indigo-200 rounded-full flex items-center justify-center text-indigo-600 text-xl font-bold">
                {{ currentUser.name.charAt(0) }}
            </div>
            <div>
                <h3 class="text-xl font-bold text-gray-900">Welcome, {{ currentUser.name }}</h3>
                <p class="text-indigo-600">{{ currentUser.booksOut }} books currently borrowed</p>
            </div>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center p-8 text-center">

            <!-- Step 1: User Scan -->
            <div *ngIf="step === 'USER_SCAN'">
                <div class="mb-8 relative">
                    <div class="absolute inset-0 bg-indigo-500 rounded-full blur-xl opacity-20 animate-pulse"></div>
                    <i class="fas fa-id-card text-8xl text-indigo-600 relative z-10"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-900 mb-2">Scan Your ID Card</h2>
                <p class="text-gray-500 mb-8">Place your ID card under the scanner</p>
                <input id="barcodeInput" type="text" [(ngModel)]="userBarcode" (keyup.enter)="onUserScan()"
                    class="w-full max-w-md px-6 py-4 text-2xl text-center border-2 border-indigo-100 rounded-xl focus:border-indigo-500 focus:ring focus:ring-indigo-200 transition-all outline-none"
                    placeholder="Scanning..." autofocus>
            </div>

            <!-- Step 2: Book Scan -->
            <div *ngIf="step === 'BOOK_SCAN'">
                <div class="mb-8 relative">
                    <div class="absolute inset-0 bg-indigo-500 rounded-full blur-xl opacity-20 animate-pulse"></div>
                    <i class="fas fa-barcode text-8xl text-indigo-600 relative z-10"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-900 mb-2">Scan Book Barcode</h2>
                <p class="text-gray-500 mb-8">Scan the barcode on the back of the book</p>
                <input id="barcodeInput" type="text" [(ngModel)]="bookBarcode" (keyup.enter)="onBookScan()"
                    class="w-full max-w-md px-6 py-4 text-2xl text-center border-2 border-indigo-100 rounded-xl focus:border-indigo-500 focus:ring focus:ring-indigo-200 transition-all outline-none"
                    placeholder="Scanning..." autofocus>
            </div>

            <!-- Step 3: Success -->
            <div *ngIf="step === 'SUCCESS'">
                <div class="mb-8">
                    <div
                        class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto text-green-600 animate-bounce">
                        <i class="fas fa-check text-5xl"></i>
                    </div>
                </div>
                <h2 class="text-3xl font-bold text-gray-900 mb-2">Success!</h2>
                <p class="text-gray-500 mb-8">{{ successMessage }}</p>

                <button (click)="resetState()"
                    class="bg-indigo-600 text-white px-8 py-3 rounded-xl hover:bg-indigo-700 transition-colors font-medium text-lg">
                    Scan Another
                </button>
            </div>

        </div>
    </div>

</div>
