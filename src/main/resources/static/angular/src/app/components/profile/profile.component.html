<div class="setup-layout">
  <app-settings-sidebar></app-settings-sidebar>
  
  <div class="profile-container">
    <!-- Header -->
    <div class="content-header">
      <h1 class="content-title">Profiles</h1>
      <p class="content-description">Manage user profiles and define permissions for different user roles</p>
    </div>

    <!-- Content Body -->
    <div class="content-body">
      <!-- Search and Action Bar -->
      <div class="search-bar-container">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input 
            type="text" 
            placeholder="Search profiles..." 
            [(ngModel)]="searchTerm"
            class="search-input"
          >
        </div>
        <button class="btn-new-profile" (click)="createProfile()">
          <i class="fas fa-plus me-2"></i> New Profile
        </button>
      </div>

      <!-- Profiles Table -->
      <div class="table-container">
        <table class="profiles-table" *ngIf="filteredProfiles.length > 0; else noProfiles">
          <thead>
            <tr>
              <th>Profile Name</th>
              <th>Description</th>
              <th>Users</th>
              <th>Created</th>
              <th>Last Modified</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let profile of filteredProfiles" (click)="viewProfile(profile)" class="profile-row">
              <td>
                <a class="profile-name">{{ profile.name }}</a>
              </td>
              <td>{{ profile.description }}</td>
              <td class="text-center">{{ profile.usersCount }}</td>
              <td>{{ profile.createdDate }}</td>
              <td>{{ profile.lastModified }}</td>
              <td class="actions-cell">
                <button class="action-btn edit-btn" (click)="viewProfile(profile); $event.stopPropagation()" title="Edit">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="action-btn delete-btn" (click)="deleteProfile(profile); $event.stopPropagation()" title="Delete">
                  <i class="fas fa-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <ng-template #noProfiles>
          <div class="empty-state">
            <i class="fas fa-user-shield"></i>
            <p>No profiles found</p>
            <button class="btn-new-profile" (click)="createProfile()">Create First Profile</button>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
