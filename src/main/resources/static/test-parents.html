<!DOCTYPE html>
<html lang="en" ng-app="testApp">
<head>
    <meta charset="UTF-8">
    <title>Test Parents</title>
    <script src="/vendor/angularjs/angular.min.js"></script>
    <script src="/vendor/angularjs/angular-route.min.js"></script>
    <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div ng-controller="TestController">
        <h1>Test Parents Loading</h1>
        
        <p><strong>Controller Status:</strong> {{controllerLoaded ? 'LOADED' : 'NOT LOADED'}}</p>
        <p><strong>API Service Status:</strong> {{apiServiceLoaded ? 'LOADED' : 'NOT LOADED'}}</p>
        <p><strong>Parent Service Status:</strong> {{parentServiceLoaded ? 'LOADED' : 'NOT LOADED'}}</p>
        
        <button ng-click="testDirectAPICall()" class="btn btn-primary">Test Direct API Call</button>
        <button ng-click="testParentService()" class="btn btn-success">Test Parent Service</button>
        
        <div ng-show="loading">Loading...</div>
        <div ng-show="error" class="alert alert-danger">Error: {{error}}</div>
        <div ng-show="result" class="alert alert-success">
            <h4>Result:</h4>
            <pre>{{result | json}}</pre>
        </div>
    </div>

    <!-- Include our services -->
    <script src="/js/app.js"></script>
    <script src="/js/services/api.js"></script>
    <script src="/js/services/parent.service.js"></script>
    
    <script>
        // Simple test app
        angular.module('testApp', ['erpApp'])
        .controller('TestController', ['$scope', '$http', 'ApiService', 'ParentService', 
            function($scope, $http, ApiService, ParentService) {
                console.log('TestController initialized');
                
                $scope.controllerLoaded = true;
                $scope.apiServiceLoaded = !!ApiService;
                $scope.parentServiceLoaded = !!ParentService;
                $scope.loading = false;
                $scope.error = null;
                $scope.result = null;
                
                console.log('ApiService:', ApiService);
                console.log('ParentService:', ParentService);
                
                $scope.testDirectAPICall = function() {
                    console.log('Testing direct API call...');
                    $scope.loading = true;
                    $scope.error = null;
                    $scope.result = null;
                    
                    $http.get('/api/parents')
                        .then(function(response) {
                            console.log('Direct API success:', response.data);
                            $scope.result = response.data;
                            $scope.loading = false;
                        })
                        .catch(function(error) {
                            console.error('Direct API error:', error);
                            $scope.error = error.message || 'Unknown error';
                            $scope.loading = false;
                        });
                };
                
                $scope.testParentService = function() {
                    console.log('Testing ParentService...');
                    $scope.loading = true;
                    $scope.error = null;
                    $scope.result = null;
                    
                    try {
                        ParentService.getAllParents(0, 10)
                            .then(function(response) {
                                console.log('ParentService success:', response);
                                $scope.result = response;
                                $scope.loading = false;
                            })
                            .catch(function(error) {
                                console.error('ParentService error:', error);
                                $scope.error = error.message || 'Unknown error';
                                $scope.loading = false;
                            });
                    } catch (e) {
                        console.error('ParentService exception:', e);
                        $scope.error = e.message || 'Exception occurred';
                        $scope.loading = false;
                    }
                };
            }
        ]);
    </script>
</body>
</html>
